services:
  web:
    image: ghcr.io/thevajko/vaii-web-server:main
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    volumes:
      - ./../:/var/www/html/
    ports:
      - "127.0.0.1:80:80"
    stdin_open: true
    tty: true
    # Allows access to the bind-mounted project on SELinux hosts (e.g. Fedora/Bazzite with Podman)
    security_opt:
      - label:disable
  db:
    image: mariadb
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    security_opt:
      - label:disable
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
  adminer:
    depends_on:
      - db
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db